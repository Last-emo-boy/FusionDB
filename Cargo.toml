[package]
name = "fusiondb"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"
default-run = "fusiondb"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = "0.8.8"
bytes = "1.11.0"
futures = "0.3.31"
pgwire = { version = "0.37.0", default-features = false, features = ["server-api-aws-lc-rs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
sqlparser = "0.60.0"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
uuid = { version = "1.19.0", features = ["v4", "fast-rng"] }
bincode = "1.3.3"
moka = { version = "0.12.0", features = ["sync"] }
lazy_static = "1.5.0"
parking_lot = "0.12.3"
reqwest = { version = "0.12.0", features = ["json"] }
hdrhistogram = "7.5.4"
crossbeam-skiplist = "0.1.3"
crossbeam-utils = "0.8.21"
arrow = "57.1.0"
rand = { version = "0.9.2", features = ["std", "std_rng"] }
http = "1.4.0"
fastbloom = { version = "0.14.0", features = ["serde"] }
hora = "0.1.1"
rayon = "1.11.0"
roaring = { version = "0.11.3", features = ["serde"] }
openraft = { version = "0.9", features = ["serde"] }
toml = "0.8"
crc32fast = "1.4"
csv = "1.4"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
axum-server = { version = "0.7", features = ["tls-rustls"] }
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
base64 = "0.22"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
lz4_flex = "0.11"
tikv-jemallocator = "0.7.0"

[[bin]]
name = "fusiondb"
path = "src/main.rs"

[[bin]]
name = "fusiondb-cli"
path = "src/bin/fusiondb-cli.rs"

[dev-dependencies]
env_logger = "0.11.8"
tokio-postgres = { version = "0.7.15", features = ["with-chrono-0_4"] }
tower = { version = "0.5", features = ["util"] }
